<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" font-family="'Amazon Ember', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Northwood aggregates</title>
  <desc id="d">Eighteen aggregates in six subdomains, each card naming its root and inner entities, the invariant it guards, and the aggregates it refers to by identity. The three Sagas are listed apart: they have state and a lifecycle but belong to no subdomain's model. Totals and copies are views, not aggregates.</desc>
  <style>
    svg { --bg:#ffffff; --ink:#16191f; --muted:#545b64; --card:#ffffff; --card-line:#aab7b8;
          --core:#ed7100; --core-fill:#fff5eb; --sup:#1d63ed; --sup-fill:#eef3fe; --gen:#545b64; --gen-fill:#f2f3f3;
          --ref:#8c4fff; --note:#fffbe6; --note-line:#d9b800; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#0f1419; --ink:#e6edf3; --muted:#9aa7b4; --card:#161c23; --card-line:#4b5866;
            --core:#ff9a3c; --core-fill:#261a0d; --sup:#5b8cff; --sup-fill:#111c33; --gen:#9aa7b4; --gen-fill:#1b222b;
            --ref:#b18cff; --note:#26220f; --note-line:#a08a1a; }
    }
    .bg { fill:var(--bg); }
    text { fill:var(--ink); font-size:12px; }
    .muted { fill:var(--muted); font-size:10.5px; }
    .ref { fill:var(--ref); font-size:10.5px; }
    .h { font-weight:600; font-size:13px; }
    .b { font-weight:600; font-size:11.5px; }
    .core { fill:var(--core-fill); stroke:var(--core); stroke-width:2.2; }
    .sup { fill:var(--sup-fill); stroke:var(--sup); stroke-width:1.3; }
    .gen { fill:var(--gen-fill); stroke:var(--gen); stroke-width:1.3; }
    .card { fill:var(--card); stroke:var(--card-line); stroke-width:1; }
    .tmpl { fill:none; stroke:var(--card-line); stroke-width:1; stroke-dasharray:4 3; }
    .note { fill:var(--note); stroke:var(--note-line); stroke-width:1; }
    .k-core { fill:var(--core); } .k-sup { fill:var(--sup); } .k-gen { fill:var(--gen); }
    .k-text { fill:#ffffff; font-size:10px; font-weight:600; text-anchor:middle; }
  </style>

  <rect class="bg" x="0" y="0" width="1000" height="800"/>

  <!-- Product -->
  <rect class="gen" x="12" y="12" width="316" height="96" rx="8"/>
  <text class="h" x="24" y="32">Product</text>
  <rect class="k-gen" x="258" y="20" width="60" height="18" rx="9"/><text class="k-text" x="288" y="33">generic</text>
  <rect class="card" x="22" y="42" width="296" height="56" rx="6"/>
  <text class="b" x="32" y="59">Product</text>
  <text class="muted" x="32" y="74">guards product rules 1–4 and 7</text>
  <text class="ref" x="32" y="89">→ BOM, Supplier</text>

  <!-- Sales -->
  <rect class="sup" x="342" y="12" width="316" height="160" rx="8"/>
  <text class="h" x="354" y="32">Sales</text>
  <rect class="k-sup" x="574" y="20" width="74" height="18" rx="9"/><text class="k-text" x="611" y="33">supporting</text>
  <rect class="card" x="352" y="42" width="296" height="44" rx="6"/>
  <text class="b" x="362" y="59">Customer</text>
  <text class="muted" x="362" y="76">guards a unique code</text>
  <rect class="card" x="352" y="94" width="296" height="70" rx="6"/>
  <text class="b" x="362" y="111">Sales order <tspan class="muted">· lines</tspan></text>
  <text class="muted" x="362" y="126">guards sales rules 1–3 and 6–10;</text>
  <text class="muted" x="362" y="140">reserved and shipped never exceed ordered</text>
  <text class="ref" x="362" y="155">→ Customer, Product</text>

  <!-- Manufacturing -->
  <rect class="core" x="672" y="12" width="316" height="226" rx="8"/>
  <text class="h" x="684" y="32">Manufacturing</text>
  <rect class="k-core" x="932" y="20" width="46" height="18" rx="9"/><text class="k-text" x="955" y="33">core</text>
  <rect class="card" x="682" y="42" width="296" height="56" rx="6"/>
  <text class="b" x="692" y="59">BOM <tspan class="muted">· lines</tspan></text>
  <text class="muted" x="692" y="74">guards manufacturing rules 1 and 2</text>
  <text class="ref" x="692" y="89">→ Product (finished and components)</text>
  <rect class="card" x="682" y="106" width="296" height="84" rx="6"/>
  <text class="b" x="692" y="123">Work order <tspan class="muted">· materials, operations</tspan></text>
  <text class="muted" x="692" y="138">guards manufacturing rules 5, 6 and 9</text>
  <text class="ref" x="692" y="153">→ Product, BOM, parent work order,</text>
  <text class="ref" x="692" y="167">replenishment request, sales order</text>
  <text class="muted" x="692" y="181">(the last two only when there is one)</text>
  <rect class="tmpl" x="682" y="198" width="296" height="30" rx="6"/>
  <text class="muted" x="692" y="217">Routing · a template, not yet an aggregate</text>

  <!-- Inventory -->
  <rect class="sup" x="12" y="186" width="316" height="372" rx="8"/>
  <text class="h" x="24" y="206">Inventory</text>
  <rect class="k-sup" x="244" y="194" width="74" height="18" rx="9"/><text class="k-text" x="281" y="207">supporting</text>
  <rect class="card" x="22" y="216" width="296" height="56" rx="6"/>
  <text class="b" x="32" y="233">Stock reservation <tspan class="muted">· lines</tspan></text>
  <text class="muted" x="32" y="248">guards exactly one source</text>
  <text class="ref" x="32" y="263">→ the sales order or the work order it serves</text>
  <rect class="card" x="22" y="280" width="296" height="56" rx="6"/>
  <text class="b" x="32" y="297">Goods receipt <tspan class="muted">· lines</tspan></text>
  <text class="muted" x="32" y="312">posted, never changed</text>
  <text class="ref" x="32" y="327">→ one Purchase order</text>
  <rect class="card" x="22" y="344" width="296" height="56" rx="6"/>
  <text class="b" x="32" y="361">Shipment <tspan class="muted">· lines</tspan></text>
  <text class="muted" x="32" y="376">posted, never changed</text>
  <text class="ref" x="32" y="391">→ one Sales order</text>
  <rect class="card" x="22" y="408" width="296" height="56" rx="6"/>
  <text class="b" x="32" y="425">Stock adjustment <tspan class="muted">· one line</tspan></text>
  <text class="muted" x="32" y="440">posted, never changed</text>
  <text class="ref" x="32" y="455">→ Product</text>
  <rect class="card" x="22" y="472" width="296" height="76" rx="6"/>
  <text class="b" x="32" y="489">Replenishment request</text>
  <text class="muted" x="32" y="504">guards inventory rule 10: at most one open</text>
  <text class="ref" x="32" y="519">→ Product, Work order or Purchase requisition,</text>
  <text class="ref" x="32" y="533">Purchase order, Sales order</text>

  <!-- Purchasing -->
  <rect class="sup" x="342" y="186" width="316" height="290" rx="8"/>
  <text class="h" x="354" y="206">Purchasing</text>
  <rect class="k-sup" x="574" y="194" width="74" height="18" rx="9"/><text class="k-text" x="611" y="207">supporting</text>
  <rect class="card" x="352" y="216" width="296" height="44" rx="6"/>
  <text class="b" x="362" y="233">Supplier</text>
  <text class="muted" x="362" y="250">guards a unique code</text>
  <rect class="card" x="352" y="268" width="296" height="56" rx="6"/>
  <text class="b" x="362" y="285">Supplier product price</text>
  <text class="muted" x="362" y="300">guards purchasing rules 6 and 7</text>
  <text class="ref" x="362" y="315">→ Supplier, Product</text>
  <rect class="card" x="352" y="332" width="296" height="70" rx="6"/>
  <text class="b" x="362" y="349">Purchase requisition <tspan class="muted">· lines</tspan></text>
  <text class="muted" x="362" y="364">guards: the source matches the source type</text>
  <text class="ref" x="362" y="379">→ Product (manual) or</text>
  <text class="ref" x="362" y="393">Replenishment request (stock replenishment)</text>
  <rect class="card" x="352" y="410" width="296" height="56" rx="6"/>
  <text class="b" x="362" y="427">Purchase order <tspan class="muted">· lines</tspan></text>
  <text class="muted" x="362" y="442">guards purchasing rules 4 and 5</text>
  <text class="ref" x="362" y="457">→ Supplier, Purchase requisition</text>

  <!-- Finance -->
  <rect class="sup" x="672" y="252" width="316" height="306" rx="8"/>
  <text class="h" x="684" y="272">Finance</text>
  <rect class="k-sup" x="904" y="260" width="74" height="18" rx="9"/><text class="k-text" x="941" y="273">supporting</text>
  <rect class="card" x="682" y="282" width="296" height="56" rx="6"/>
  <text class="b" x="692" y="299">Customer invoice <tspan class="muted">· lines</tspan></text>
  <text class="muted" x="692" y="314">paid amount never exceeds the total</text>
  <text class="ref" x="692" y="329">→ Sales order</text>
  <rect class="card" x="682" y="346" width="296" height="56" rx="6"/>
  <text class="b" x="692" y="363">Supplier invoice <tspan class="muted">· lines</tspan></text>
  <text class="muted" x="692" y="378">the three-way match decides its status</text>
  <text class="ref" x="692" y="393">→ Purchase order, Goods receipt</text>
  <rect class="card" x="682" y="410" width="296" height="70" rx="6"/>
  <text class="b" x="692" y="427">Payment <tspan class="muted">· allocations (values)</tspan></text>
  <text class="muted" x="692" y="442">guards finance rule 4</text>
  <text class="ref" x="692" y="457">→ the Customer or the Supplier,</text>
  <text class="ref" x="692" y="471">and each invoice it is allocated to</text>
  <rect class="card" x="682" y="488" width="296" height="60" rx="6"/>
  <text class="b" x="692" y="505">Journal entry <tspan class="muted">· lines</tspan></text>
  <text class="muted" x="692" y="520">guards finance rules 1–3 · written once,</text>
  <text class="muted" x="692" y="534">announces nothing · → its source document</text>

  <!-- Sagas -->
  <rect class="gen" x="12" y="574" width="976" height="92" rx="8"/>
  <text class="h" x="24" y="594">Sagas</text>
  <text class="muted" x="76" y="594">not in any subdomain's model, but each has state and a lifecycle</text>
  <rect class="card" x="22" y="604" width="312" height="52" rx="6"/>
  <text class="b" x="32" y="621">Sales-order fulfilment</text>
  <text class="muted" x="32" y="636">lives in Sales</text>
  <text class="ref" x="32" y="650">→ one Sales order</text>
  <rect class="card" x="344" y="604" width="312" height="52" rx="6"/>
  <text class="b" x="354" y="621">Work order</text>
  <text class="muted" x="354" y="636">lives in Manufacturing</text>
  <text class="ref" x="354" y="650">→ one Work order</text>
  <rect class="card" x="666" y="604" width="312" height="52" rx="6"/>
  <text class="b" x="676" y="621">Purchase-to-pay</text>
  <text class="muted" x="676" y="636">lives in Purchasing</text>
  <text class="ref" x="676" y="650">→ one Purchase order</text>

  <!-- totals are views -->
  <rect class="note" x="12" y="680" width="976" height="62" rx="6"/>
  <text class="b" x="24" y="698">Deltas get aggregates, totals get views (rule 5.7)</text>
  <text class="muted" x="24" y="714">Stock balance, WIP balance, an invoice's paid amount and an account balance are totals of these facts; product cards are copies of Product.</text>
  <text class="muted" x="24" y="728">None of them is an aggregate, so none can disagree with the facts that made it.</text>

  <!-- legend -->
  <g transform="translate(12,770)">
    <text class="b" x="0" y="4">Name</text><text class="muted" x="40" y="4">the root · <tspan>its inner entities</tspan></text>
    <text class="muted" x="250" y="4">the invariant it guards</text>
    <text class="ref" x="410" y="4">→ the aggregates it refers to, by identity only</text>
  </g>
</svg>
