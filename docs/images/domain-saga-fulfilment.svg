<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="'Amazon Ember', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Sales-order fulfilment Saga, forward flow</title>
  <desc id="d">From started, the Saga waits for prepayment under prepayment or deposit terms, waits for release when a planning time fence is set, or requests stock reservation at once. After the up-front payment it is prepaid, then requests stock or waits for release. A reservation with short lines waits for replenishment and retries; a cancelled replenishment rejects the order. With every line reserved, supply is secured, and the Saga completes once the order is shipped and paid. Any state may go to failed.</desc>
  <style>
    svg { --bg:#ffffff; --ink:#16191f; --muted:#545b64; --act:#eef3fe; --act-line:#1d63ed; --wait:#fff5eb; --wait-line:#ed7100;
          --term:#232f3e; --term-text:#ffffff; --line:#16191f; --note:#fffbe6; --note-line:#d9b800; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#0f1419; --ink:#e6edf3; --muted:#9aa7b4; --act:#111c33; --act-line:#5b8cff; --wait:#261a0d; --wait-line:#ff9a3c;
            --term:#c9d1d9; --term-text:#0f1419; --line:#e6edf3; --note:#26220f; --note-line:#a08a1a; }
    }
    .bg { fill:var(--bg); }
    text { fill:var(--ink); font-size:12px; }
    .muted { fill:var(--muted); font-size:10.5px; }
    .lbl { fill:var(--muted); font-size:10.5px; }
    .b { font-weight:600; font-size:12px; }
    .c { text-anchor:middle; }
    .act { fill:var(--act); stroke:var(--act-line); stroke-width:1.4; }
    .wait { fill:var(--wait); stroke:var(--wait-line); stroke-width:1.4; stroke-dasharray:5 3; }
    .term { fill:var(--term); stroke:var(--term); stroke-width:1.4; }
    .term-t { fill:var(--term-text); font-weight:600; font-size:12px; text-anchor:middle; }
    .line { fill:none; stroke:var(--line); stroke-width:1.5; }
    .dot { fill:var(--line); }
    .note { fill:var(--note); stroke:var(--note-line); stroke-width:1; }
    .head { fill:var(--line); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="640"/>

  <!-- states -->
  <circle class="dot" cx="500" cy="16" r="6"/>
  <path class="line" d="M500,22 V38" marker-end="url(#a)"/>
  <rect class="act" x="405" y="40" width="190" height="40" rx="20"/><text class="b c" x="500" y="58">started</text><text class="muted c" x="500" y="72">the sales order is placed</text>

  <rect class="wait" x="60" y="150" width="210" height="40" rx="20"/><text class="b c" x="165" y="168">awaiting prepayment</text><text class="muted c" x="165" y="182">waits for the up-front payment</text>
  <rect class="act" x="60" y="250" width="210" height="40" rx="20"/><text class="b c" x="165" y="268">prepaid</text><text class="muted c" x="165" y="282">the up-front invoice is paid</text>
  <rect class="wait" x="730" y="150" width="210" height="40" rx="20"/><text class="b c" x="835" y="168">awaiting release</text><text class="muted c" x="835" y="182">waits for the release time</text>

  <rect class="act" x="395" y="350" width="210" height="40" rx="20"/><text class="b c" x="500" y="368">stock reservation requested</text><text class="muted c" x="500" y="382">Inventory has been asked</text>
  <rect class="wait" x="730" y="350" width="210" height="40" rx="20"/><text class="b c" x="835" y="368">stock reservation incomplete</text><text class="muted c" x="835" y="382">waits for each replenishment</text>

  <rect class="wait" x="395" y="460" width="210" height="40" rx="20"/><text class="b c" x="500" y="478">supply secured</text><text class="muted c" x="500" y="492">waits until shipped and paid</text>
  <rect class="term" x="730" y="460" width="210" height="40" rx="6"/><text class="term-t" x="835" y="485">rejected</text>
  <rect class="term" x="395" y="560" width="210" height="40" rx="6"/><text class="term-t" x="500" y="585">completed</text>

  <!-- transitions -->
  <path class="line" d="M405,60 H165 V148" marker-end="url(#a)"/>
  <text class="lbl c" x="285" y="54">prepayment or deposit terms</text>
  <path class="line" d="M595,60 H835 V148" marker-end="url(#a)"/>
  <text class="lbl c" x="715" y="54">a planning time fence is set</text>
  <path class="line" d="M500,80 V348" marker-end="url(#a)"/>
  <text class="lbl" x="508" y="120">neither: reserve now</text>

  <path class="line" d="M165,190 V248" marker-end="url(#a)"/>
  <text class="lbl" x="173" y="224">up-front invoice paid</text>
  <path class="line" d="M165,290 V370 H393" marker-end="url(#a)"/>
  <text class="lbl" x="173" y="330">no fence pending: reserve</text>
  <path class="line" d="M270,270 H660 V170 H728" marker-end="url(#a)"/>
  <text class="lbl" x="280" y="264">fence still closed</text>
  <path class="line" d="M835,190 V310 H560 V348" marker-end="url(#a)"/>
  <text class="lbl" x="843" y="254">release time reached</text>

  <path class="line" d="M605,362 H728" marker-end="url(#a)"/>
  <text class="lbl c" x="667" y="356">some lines short</text>
  <path class="line" d="M730,380 H607" marker-end="url(#a)"/>
  <text class="lbl c" x="667" y="404">every short line</text>
  <text class="lbl c" x="667" y="416">replenished: retry</text>
  <path class="line" d="M835,390 V458" marker-end="url(#a)"/>
  <text class="lbl" x="843" y="428">a replenishment was cancelled</text>
  <path class="line" d="M500,390 V458" marker-end="url(#a)"/>
  <text class="lbl" x="508" y="428">every line reserved</text>
  <path class="line" d="M500,500 V558" marker-end="url(#a)"/>
  <text class="lbl" x="508" y="534">shipped and paid</text>

  <!-- notes -->
  <rect class="note" x="40" y="450" width="300" height="56" rx="6"/>
  <text class="b" x="52" y="468">failed</text>
  <text class="muted" x="52" y="484">Any state may end here: something broke</text>
  <text class="muted" x="52" y="497">that is not a business outcome.</text>
  <rect class="note" x="40" y="516" width="300" height="56" rx="6"/>
  <text class="b" x="52" y="534">Cancellation</text>
  <text class="muted" x="52" y="550">From any state before the first shipment:</text>
  <text class="muted" x="52" y="563">see the cancellation diagram.</text>

  <!-- legend -->
  <g transform="translate(40,618)">
    <rect class="act" x="0" y="-9" width="34" height="18" rx="9"/><text class="muted" x="42" y="4">acting</text>
    <rect class="wait" x="110" y="-9" width="34" height="18" rx="9"/><text class="muted" x="152" y="4">waiting</text>
    <rect class="term" x="220" y="-9" width="34" height="18" rx="4"/><text class="muted" x="262" y="4">terminal</text>
  </g>
</svg>
